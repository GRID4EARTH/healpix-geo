name: js release

on:
  push:
    tags:
      - "js-v*"
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-bundle:
    name: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag')
      || (
        github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'release')
      )

    defaults:
      run:
        working-directory: healpix-geo-js

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup rust
        run: |
          cargo install wasm-pack@0.15.0

      - name: build esm bundle
        run: |
          bash scripts/build.sh --mode release bundler

      - name: pack the package
        run: |
          wasm-pack pack pkg

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: healpix-geo-js/pkg/healpix-geo*.tgz
          if-no-files-found: "error"

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: build-bundle
    if: |
      needs.build-bundle.result == 'success'
      && (github.event_name == 'push' && github.ref_type == 'tag')

    environment:
      name: npm
      url: https://npmjs.com/package/healpix-geo

    permissions:
      id-token: write # upload packages to npm

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - name: unpack
        working-directory: dist
        run: tar xvfz healpix-geo*.tgz
      - name: publish
        working-directory: dist/package
        run: |
          npm stage publish
