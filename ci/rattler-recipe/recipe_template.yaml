package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - path: ../..

build:
  number: 0

  script: |
    export MATURIN_PYTHON_SYSCONFIGDATA_DIR=${PREFIX}/etc/conda/_sysconfigdata__emscripten_wasm32-emscripten.py
    ${PYTHON} -m pip install ./healpix-geo-python -vvv --no-build-isolation --no-deps

  python:
    skip_pyc_compilation:
      - "**/*.py"

requirements:
  build:
    - maturin
    - cross-python_${{ target_platform }}
    - rust-nightly
    - setuptools-rust
  host:
    - python
    - numpy
    # conda-forge's pip no longer vendors cacert.pem and looks it up in
    # `sys.base_prefix`, which for cross-python is the host prefix
    - ca-certificates
  run:
    - python
    - numpy
    - marray-python

tests:
  - script:
      - echo "FIXME:"
